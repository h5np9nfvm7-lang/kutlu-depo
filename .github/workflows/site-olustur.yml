# İlanlardan Google için sayfalar ve sitemap.xml üretir.
# Her 3 saatte bir kendiliğinden çalışır; panelden eklenen ilanlar en geç
# 3 saat içinde Google'ın okuyabileceği ayrı sayfalara dönüşür.
name: Arama sayfalarını güncelle

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/site-olustur.yml']

permissions:
  contents: write

concurrency:
  group: site-olustur
  cancel-in-progress: false

jobs:
  olustur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sayfaları üret
        run: node scripts/olustur.mjs
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          git commit -m "Arama sayfaları güncellendi"
          git push
