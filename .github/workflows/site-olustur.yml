# İlanlardan Google için sayfalar ve sitemap.xml üretir.
# Her 3 saatte bir kendiliğinden çalışır; panelden eklenen ilanlar en geç
# 3 saat içinde Google'ın okuyabileceği ayrı sayfalara dönüşür.
name: Arama sayfalarını güncelle

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/site-olustur.yml']

permissions:
  contents: write

concurrency:
  group: site-olustur
  cancel-in-progress: false

jobs:
  olustur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Kütüphaneleri siteye kopyala (yoksa)
        # Ziyaretçinin tarayıcısı dış sunuculara (CDN) bağlanmasın diye
        # kütüphaneler bir kez indirilip sitenin içinde saklanır.
        run: |
          mkdir -p vendor/leaflet/images
          [ -s vendor/supabase.js ] || curl -fsSL https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js -o vendor/supabase.js
          for f in leaflet.js leaflet.css images/marker-icon.png images/marker-icon-2x.png images/marker-shadow.png images/layers.png images/layers-2x.png; do
            [ -s "vendor/leaflet/$f" ] || curl -fsSL "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/$f" -o "vendor/leaflet/$f"
          done
      - name: Sayfaları üret
        run: node scripts/olustur.mjs
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Değişiklik yok."; exit 0; fi
          git commit -m "Arama sayfaları güncellendi"
          git push
