<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Favorilerim | Bizim Emlak</title>
<meta name="description" content="Favori ilanlarınız ve karşılaştırma.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#111111">
<link rel="icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
<header id="site-ust"></header>

<main>
  <section class="sayfa-bas">
    <div class="kap">
      <div class="yol"><a href="./">Ana Sayfa</a> / Favorilerim</div>
      <h1>Favorilerim</h1>
      <p>Beğendiğiniz ilanlar bu cihazda saklanır. Kalp simgesine tıklayarak ekleyip çıkarabilirsiniz.</p>
    </div>
  </section>

  <section class="bolum" style="padding-top:36px">
    <div class="kap">
      <div class="ust-satir">
        <strong id="fav-bilgi"></strong>
        <div style="display:flex;gap:10px;flex-wrap:wrap">
          <button type="button" class="btn btn-siyah btn-kucuk gizli" id="karsilastir-btn">Karşılaştır</button>
          <button type="button" class="btn btn-cizgi btn-kucuk gizli" id="temizle-btn">Tümünü Temizle</button>
        </div>
      </div>
      <div class="ilan-izgara" id="favoriler"></div>
    </div>
  </section>

  <section class="bolum bolum-gri gizli" id="karsilastir-bolum">
    <div class="kap">
      <div class="ust-satir"><h2>Karşılaştırma</h2></div>
      <div class="tablo-kap kart-blok" style="padding:0"><table class="tablo karsilastir-tablo" id="karsilastir"></table></div>
    </div>
  </section>
</main>

<footer id="site-alt"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=6"></script>
<script src="js/common.js?v=6"></script>
<script>
(async function () {
  const { $, esc } = BE;
  const el = $('#favoriler');
  el.innerHTML = BE.kartIskelet(3);
  await BE.sayfaBaslat('favoriler.html');
  let ilanlar = [];

  function ciz() {
    const fav = BE.favoriler();
    const liste = fav.map((id) => ilanlar.find((i) => String(i.id) === id)).filter(Boolean);
    $('#fav-bilgi').textContent = liste.length ? `${liste.length} favori ilan` : '';
    $('#karsilastir-btn').classList.toggle('gizli', liste.length < 2);
    $('#temizle-btn').classList.toggle('gizli', !liste.length);
    el.innerHTML = liste.length ? liste.map(BE.kart).join('') : `
      <div class="bos-durum" style="grid-column:1/-1">${BE.ikon('kalp')}
        <h3>Henüz favori ilanınız yok</h3>
        <p>İlanlardaki kalp simgesine tıklayarak beğendiklerinizi buraya ekleyebilirsiniz.</p>
        <a href="ilanlar.html" class="btn btn-kirmizi">İlanlara Göz At</a></div>`;
    if (liste.length < 2) $('#karsilastir-bolum').classList.add('gizli');
    else if (!$('#karsilastir-bolum').classList.contains('gizli')) karsilastir();
    BE.belirt();
    return liste;
  }

  function karsilastir() {
    const l = BE.favoriler().map((id) => ilanlar.find((i) => String(i.id) === id)).filter(Boolean).slice(0, 4);
    const v = (x) => (x === null || x === undefined || x === '') ? '-' : x;
    const e = (b) => b ? '✓' : '✗';
    const sat = [
      ['', (i) => i.resimler && i.resimler[0] ? `<img src="${esc(i.resimler[0])}" alt="">` : ''],
      ['İlan', (i) => `<a href="ilan.html?id=${i.id}" style="color:var(--kirmizi);font-weight:700">${esc(i.baslik)}</a>`],
      ['Fiyat', (i) => `<strong>${BE.fiyat(i)}</strong>`],
      ['Tip', (i) => esc(i.tip)], ['Kategori', (i) => esc(i.kategori)], ['Konum', (i) => esc(BE.konum(i))],
      ['Net / Brüt m²', (i) => `${v(i.net_m2)} / ${v(i.brut_m2)}`],
      ['m² Fiyatı', (i) => (i.fiyat && (i.net_m2 || i.brut_m2)) ? BE.tl(i.fiyat / (i.net_m2 || i.brut_m2)) : '-'],
      ['Oda', (i) => esc(v(i.oda_sayisi))], ['Banyo', (i) => v(i.banyo_sayisi)], ['Bina Yaşı', (i) => v(i.bina_yasi)],
      ['Kat', (i) => `${esc(v(i.bulundugu_kat))} / ${v(i.kat_sayisi)}`], ['Isıtma', (i) => esc(v(i.isitma))],
      ['Aidat', (i) => i.aidat ? BE.tl(i.aidat) : '-'],
      ['Eşyalı', (i) => e(i.esyali)], ['Balkon', (i) => e(i.balkon)], ['Asansör', (i) => e(i.asansor)],
      ['Otopark', (i) => e(i.otopark)], ['Site İçi', (i) => e(i.site_icinde)], ['Krediye Uygun', (i) => e(i.krediye_uygun)]
    ];
    $('#karsilastir').innerHTML = '<tbody>' + sat.map(([k, f]) => `<tr><td>${k}</td>${l.map((i) => `<td>${f(i)}</td>`).join('')}</tr>`).join('') + '</tbody>';
    $('#karsilastir-bolum').classList.remove('gizli');
  }

  $('#karsilastir-btn').addEventListener('click', () => { karsilastir(); $('#karsilastir-bolum').scrollIntoView({ behavior: 'smooth' }); });
  $('#temizle-btn').addEventListener('click', () => { BE.depola.yaz('be_favoriler', []); BE.favSayiGuncelle(); ciz(); });
  document.addEventListener('favori-degisti', ciz);

  const fav = BE.favoriler();
  if (!fav.length) { ciz(); return; }
  try { ilanlar = await BE.ilanlar({ ids: fav, tumu: true }); ciz(); }
  catch (err) { console.error(err); el.innerHTML = BE.hataHtml(); }
})();
</script>
</body>
</html>
