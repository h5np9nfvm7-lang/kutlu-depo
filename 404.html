<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa Bulunamadı | Bizim Emlak</title>
<meta name="robots" content="noindex">
<script>
  // Yeni eklenen bir ilanın sayfası henüz üretilmediyse ilan detayına yönlendir
  (function () {
    var m = location.pathname.match(/ilan-(\d+)(?:-[^/]*)?(?:\.html)?$/);
    if (m) { location.replace('/ilan.html?id=' + m[1]); return; }
    // Eski sitenin (.php) adreslerini yeni sayfalara yönlendir
    var p = location.pathname.toLowerCase();
    if (/\.(php|asp|aspx)$/.test(p)) {
      if (/arama|ilan|emlak|liste|detay|portfoy/.test(p)) location.replace('/ilanlar.html');
      else if (/iletisim|contact/.test(p)) location.replace('/iletisim.html');
      else if (/hakkimizda|about|kurumsal/.test(p)) location.replace('/hakkimizda.html');
      else location.replace('/');
    }
  })();
</script>
<link rel="icon" type="image/png" sizes="96x96" href="/images/favicon.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css?v=26">
</head>
<body>
<main class="kap" style="min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center">
  <div>
    <img src="/images/logo.png" alt="Bizim Emlak" style="max-width:240px;margin:0 auto 24px">
    <h1>Aradığınız sayfa bulunamadı</h1>
    <p>Bu ilan yayından kaldırılmış veya adres hatalı olabilir.</p>
    <p style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <a class="btn btn-kirmizi" href="/ilanlar.html">Tüm İlanlar</a>
      <a class="btn btn-cizgi" href="/">Ana Sayfa</a>
    </p>
  </div>
</main>
</body>
</html>
