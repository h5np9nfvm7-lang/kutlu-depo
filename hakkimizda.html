<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hakkımızda | Bizim Emlak</title>
<meta name="description" content="Bizim Emlak, Osmaniye'de 26 yıldır gayrimenkul alım, satım ve kiralama alanında hizmet veriyor.">
<meta property="og:title" content="Hakkımızda | Bizim Emlak">
<meta property="og:image" content="https://bizimemlak.biz/images/logo.png">
<meta name="theme-color" content="#111111">
<link rel="canonical" href="https://bizimemlak.biz/hakkimizda.html">
<meta property="og:url" content="https://bizimemlak.biz/hakkimizda.html">
<link rel="icon" href="images/favicon.png">
<link rel="stylesheet" href="css/style.css?v=11">
</head>
<body>
<header id="site-ust"></header>

<main>
  <section class="sayfa-bas">
    <div class="kap">
      <div class="yol"><a href="./">Ana Sayfa</a> / Hakkımızda</div>
      <h1>Hakkımızda</h1>
      <p data-ayar="slogan"></p>
    </div>
  </section>

  <section class="bolum">
    <div class="kap iki-kolon">
      <div class="belir">
        <h2>Biz Kimiz?</h2>
        <div class="hikaye" data-ayar="hakkimizda_metni"></div>
      </div>
      <div class="belir" style="display:flex;flex-direction:column;gap:20px">
        <div class="kutu" style="text-align:center;padding:36px">
          <img src="images/logo.png" alt="Bizim Emlak logosu" style="max-width:280px;margin:0 auto 18px">
          <div style="font-family:var(--font-baslik);font-size:3rem;font-weight:800;color:var(--kirmizi);line-height:1"><span data-ayar="tecrube_yili">26</span></div>
          <div style="font-weight:700">Yıllık Tecrübe</div>
          <p style="margin-top:8px" data-ayar="hizmet_bolgesi"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="bolum bolum-gri">
    <div class="kap kutu-izgara" style="grid-template-columns:1fr 1fr">
      <div class="kutu kutu-siyah belir">
        <div class="kutu-ikon"><svg class="ikon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg></div>
        <h3>Misyonumuz</h3><p data-ayar="misyon"></p>
      </div>
      <div class="kutu belir">
        <div class="kutu-ikon"><svg class="ikon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <h3>Vizyonumuz</h3><p data-ayar="vizyon"></p>
      </div>
    </div>
  </section>

  <section class="bolum">
    <div class="kap">
      <div class="bolum-baslik belir"><h2>Değerlerimiz</h2></div>
      <div class="kutu-izgara" id="degerler"></div>
    </div>
  </section>

  <section class="bolum bolum-gri">
    <div class="kap">
      <div class="bolum-baslik belir"><h2>Hizmetlerimiz</h2></div>
      <div class="kutu-izgara uc" id="hizmetler"></div>
    </div>
  </section>

  <section class="bolum">
    <div class="kap">
      <div class="cagri belir">
        <div><h2>Tanışmak için ofisimize bekleriz</h2><p>Çayımızı içip ihtiyaçlarınızı birlikte konuşalım.</p></div>
        <div class="butonlar"><a href="iletisim.html" class="btn btn-kirmizi">İletişim Bilgileri</a></div>
      </div>
    </div>
  </section>
</main>

<footer id="site-alt"></footer>

<script src="vendor/supabase.js?v=11"></script>
<script src="js/config.js?v=11"></script>
<script src="js/common.js?v=11"></script>
<script>
  BE.sayfaBaslat('hakkimizda.html').then((a) => {
    const k = (l, ik) => (l || []).map((x, i) => `<div class="kutu belir"><div class="kutu-ikon">${BE.ikon(ik[i % ik.length])}</div><h3>${BE.esc(x.baslik)}</h3><p>${BE.esc(x.aciklama)}</p></div>`).join('');
    document.getElementById('degerler').innerHTML = k(a.neden_biz, ['kalkan', 'grafik', 'harita', 'hiz']);
    document.getElementById('hizmetler').innerHTML = k(a.hizmetler, ['anahtar', 'ev', 'grafik', 'yildiz', 'belge', 'hesap']);
    BE.belirt();
  });
</script>
</body>
</html>
