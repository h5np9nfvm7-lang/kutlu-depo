<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İlanlar | Bizim Emlak Osmaniye</title>
<meta name="description" content="Osmaniye satılık ve kiralık daire, villa, müstakil ev, arsa, dükkan ve ofis ilanları. Fiyat, oda sayısı, metrekare ve konuma göre filtreleyin.">
<meta property="og:title" content="İlanlar | Bizim Emlak">
<meta property="og:description" content="Osmaniye satılık ve kiralık gayrimenkul ilanları.">
<meta property="og:image" content="https://bizimemlak.biz/images/paylas.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta property="og:site_name" content="Bizim Emlak"><meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#111111">
<link rel="canonical" href="https://bizimemlak.biz/ilanlar.html">
<meta property="og:url" content="https://bizimemlak.biz/ilanlar.html">
<link rel="icon" type="image/png" sizes="96x96" href="/images/favicon.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="css/style.css?v=19">
</head>
<body>
<header id="site-ust"></header>

<main>
  <section class="sayfa-bas">
    <div class="kap">
      <div class="yol"><a href="./">Ana Sayfa</a> / İlanlar</div>
      <h1 id="liste-baslik">Tüm İlanlar</h1>
      <p>Aradığınız mülkü filtreleri kullanarak kolayca bulun.</p>
    </div>
  </section>

  <section class="bolum" style="padding-top:36px">
    <div class="kap liste-duzen">
      <!-- FİLTRELER -->
      <aside class="filtre-panel" id="filtre-panel" aria-label="Filtreler">
        <h3>Filtrele <button class="btn btn-kucuk btn-cizgi filtre-kapat-x" type="button" data-filtre-kapat aria-label="Filtreleri kapat">✕</button></h3>

        <div class="filtre-grup">
          <strong>İlan Tipi</strong>
          <div class="cip-grup" data-tek="tip">
            <button type="button" class="cip" data-deger="">Tümü</button>
            <button type="button" class="cip" data-deger="Satılık">Satılık</button>
            <button type="button" class="cip" data-deger="Kiralık">Kiralık</button>
          </div>
        </div>

        <div class="filtre-grup">
          <strong>Kategori</strong>
          <div class="cip-grup" data-coklu="kategori">
            <button type="button" class="cip" data-deger="Daire">Daire</button>
            <button type="button" class="cip" data-deger="Villa">Villa</button>
            <button type="button" class="cip" data-deger="Müstakil Ev">Müstakil Ev</button>
            <button type="button" class="cip" data-deger="Arsa">Arsa</button>
            <button type="button" class="cip" data-deger="Dükkan">Dükkan</button>
            <button type="button" class="cip" data-deger="Ofis">Ofis</button>
          </div>
        </div>

        <div class="filtre-grup">
          <label class="alan"><strong>İlçe</strong>
            <select id="f-ilce"><option value="">Tüm ilçeler</option></select>
          </label>
        </div>

        <div class="filtre-grup">
          <strong>Fiyat (TL)</strong>
          <div class="iki-alan">
            <input type="number" id="f-fmin" placeholder="En az" min="0" inputmode="numeric" aria-label="En az fiyat">
            <input type="number" id="f-fmax" placeholder="En çok" min="0" inputmode="numeric" aria-label="En çok fiyat">
          </div>
        </div>

        <div class="filtre-grup">
          <strong>Oda Sayısı</strong>
          <div class="cip-grup" data-coklu="oda">
            <button type="button" class="cip" data-deger="1+0">1+0</button>
            <button type="button" class="cip" data-deger="1+1">1+1</button>
            <button type="button" class="cip" data-deger="2+1">2+1</button>
            <button type="button" class="cip" data-deger="3+1">3+1</button>
            <button type="button" class="cip" data-deger="4+1">4+1</button>
            <button type="button" class="cip" data-deger="5+">5+</button>
          </div>
        </div>

        <div class="filtre-grup">
          <strong>Metrekare (m²)</strong>
          <div class="iki-alan">
            <input type="number" id="f-mmin" placeholder="En az" min="0" inputmode="numeric" aria-label="En az metrekare">
            <input type="number" id="f-mmax" placeholder="En çok" min="0" inputmode="numeric" aria-label="En çok metrekare">
          </div>
        </div>

        <div class="filtre-grup">
          <strong>Bina Yaşı</strong>
          <div class="cip-grup" data-tek="yas">
            <button type="button" class="cip" data-deger="">Tümü</button>
            <button type="button" class="cip" data-deger="0-5">0-5</button>
            <button type="button" class="cip" data-deger="6-10">6-10</button>
            <button type="button" class="cip" data-deger="11-20">11-20</button>
            <button type="button" class="cip" data-deger="21-999">21+</button>
          </div>
        </div>

        <div class="filtre-grup" id="f-onaylar">
          <strong>Özellikler</strong>
          <label class="onay"><input type="checkbox" data-bayrak="esyali"> Eşyalı</label>
          <label class="onay"><input type="checkbox" data-bayrak="krediye_uygun"> Krediye uygun</label>
          <label class="onay"><input type="checkbox" data-bayrak="site_icinde"> Site içinde</label>
          <label class="onay"><input type="checkbox" data-bayrak="otopark"> Otopark</label>
          <label class="onay"><input type="checkbox" data-bayrak="asansor"> Asansör</label>
          <label class="onay"><input type="checkbox" data-bayrak="balkon"> Balkon</label>
          <label class="onay"><input type="checkbox" data-bayrak="takas"> Takasa uygun</label>
        </div>

        <div class="filtre-alt">
          <button type="button" class="btn btn-cizgi btn-blok" id="f-temizle">Filtreleri Temizle</button>
          <button type="button" class="btn btn-kirmizi btn-blok filtre-kapat-btn" data-filtre-kapat>Sonuçları Gör (<span id="f-sayi">0</span>)</button>
        </div>
      </aside>

      <!-- SONUÇLAR -->
      <div>
        <div class="sonuc-ust">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <button class="btn btn-siyah btn-kucuk filtre-ac" type="button" id="filtre-ac">
              <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 3H2l8 9.5V19l4 2v-8.5z"/></svg> Filtrele
            </button>
            <strong id="sonuc-sayi" aria-live="polite">İlanlar yükleniyor…</strong>
          </div>
          <div class="sag">
            <input type="search" id="f-q" placeholder="İlanlarda ara…" aria-label="İlanlarda ara" style="width:200px;padding:9px 12px">
            <select id="f-sira" aria-label="Sıralama">
              <option value="yeni">En yeni</option>
              <option value="fiyat-artan">Fiyat (düşükten yükseğe)</option>
              <option value="fiyat-azalan">Fiyat (yüksekten düşüğe)</option>
              <option value="m2">Metrekare (büyükten küçüğe)</option>
              <option value="populer">En çok görüntülenen</option>
            </select>
            <button type="button" class="gorunum-btn aktif" data-gorunum="izgara" aria-label="Izgara görünümü"><svg class="ikon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></button>
            <button type="button" class="gorunum-btn" data-gorunum="liste" aria-label="Liste görünümü"><svg class="ikon" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
            <button type="button" class="gorunum-btn" data-gorunum="harita" aria-label="Harita görünümü" title="Haritada gör"><svg class="ikon" viewBox="0 0 24 24"><path d="m1 6 7-3 8 3 7-3v15l-7 3-8-3-7 3z"/><path d="M8 3v15M16 6v15"/></svg></button>
          </div>
        </div>
        <div class="ilan-izgara" id="sonuclar"></div>
        <div id="harita-gorunum" class="gizli"><div id="ilan-harita" class="ilan-harita"></div><p id="harita-not" style="font-size:.85rem;color:var(--metin-soluk);margin-top:8px"></p></div>
        <nav class="sayfalama" id="sayfalama" aria-label="Sayfalar"></nav>
      </div>
    </div>
  </section>
</main>

<footer id="site-alt"></footer>

<script src="vendor/supabase.js?v=19"></script>
<script src="js/config.js?v=19"></script>
<script src="js/common.js?v=19"></script>
<script src="js/ilanlar.js?v=19"></script>
</body>
</html>
