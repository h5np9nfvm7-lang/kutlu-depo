<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İletişim | Bizim Emlak Osmaniye</title>
<meta name="description" content="Bizim Emlak iletişim bilgileri, adres, çalışma saatleri ve iletişim formu. Mülkünüzü satmak veya kiralamak için bize ulaşın.">
<meta property="og:title" content="İletişim | Bizim Emlak">
<meta property="og:image" content="https://bizimemlak.biz/images/logo.png">
<meta name="theme-color" content="#111111">
<link rel="canonical" href="https://bizimemlak.biz/iletisim.html">
<meta property="og:url" content="https://bizimemlak.biz/iletisim.html">
<link rel="icon" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>
<header id="site-ust"></header>

<main>
  <section class="sayfa-bas">
    <div class="kap">
      <div class="yol"><a href="./">Ana Sayfa</a> / İletişim</div>
      <h1>İletişim</h1>
      <p>Sorularınız için arayın, yazın ya da ofisimize uğrayın.</p>
    </div>
  </section>

  <section class="bolum" style="padding-top:36px">
    <div class="kap">
      <div class="iletisim-izgara" id="iletisim-kartlar"></div>
    </div>
  </section>

  <section class="bolum bolum-gri">
    <div class="kap iki-kolon">
      <div class="kart-blok" style="margin:0">
        <h2>Çalışma Saatleri <span id="acik-durum"></span></h2>
        <table class="saat-tablo" id="saatler"></table>
        <p id="saat-notu" style="font-size:.9rem;color:var(--metin-soluk);margin:12px 0 0"></p>
      </div>
      <div class="harita-kutu" id="ofis-harita" style="min-height:360px;background:#fff"></div>
    </div>
  </section>

  <section class="bolum">
    <div class="kap iki-kolon">
      <div class="kart-blok" style="margin:0">
        <h2>Bize Yazın</h2>
        <form id="iletisim-form" novalidate>
          <div class="form-izgara">
            <label class="alan"><span>Adınız Soyadınız *</span><input type="text" name="ad" required maxlength="100" autocomplete="name"></label>
            <label class="alan"><span>Telefon *</span><input type="tel" name="tel" required maxlength="30" autocomplete="tel" placeholder="05xx xxx xx xx"></label>
            <label class="alan"><span>E-posta</span><input type="email" name="eposta" maxlength="120" autocomplete="email"></label>
            <label class="alan"><span>Konu</span>
              <select name="konu">
                <option>Ev almak istiyorum</option><option>Ev satmak istiyorum</option>
                <option>Ev kiralamak istiyorum</option><option>Evimi kiraya vermek istiyorum</option>
                <option>Gayrimenkul değerleme</option><option>Diğer</option>
              </select>
            </label>
            <label class="alan tam"><span>Mesajınız *</span><textarea name="mesaj" required maxlength="3000"></textarea></label>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
            <button type="submit" class="btn btn-kirmizi">Mesajı Gönder</button>
            <button type="button" class="btn btn-wp gizli" data-wp-form="iletisim-form">WhatsApp ile Gönder</button>
          </div>
          <div class="sonuc" aria-live="polite"></div>
        </form>
      </div>

      <div class="kart-blok" style="margin:0" id="mulk-formu">
        <h2>Mülkünüzü Bize Verin</h2>
        <p style="color:var(--metin-soluk)">Satmak veya kiraya vermek istediğiniz mülkün bilgilerini bırakın, ücretsiz değerleme için sizi arayalım.</p>
        <form id="mulk-form" novalidate>
          <div class="form-izgara">
            <label class="alan"><span>Adınız Soyadınız *</span><input type="text" name="ad" required maxlength="100" autocomplete="name"></label>
            <label class="alan"><span>Telefon *</span><input type="tel" name="tel" required maxlength="30" autocomplete="tel"></label>
            <label class="alan"><span>İşlem</span><select name="islem"><option>Satmak istiyorum</option><option>Kiraya vermek istiyorum</option></select></label>
            <label class="alan"><span>Mülk Tipi</span><select name="tip"><option>Daire</option><option>Villa</option><option>Müstakil Ev</option><option>Arsa</option><option>Dükkan</option><option>Ofis</option><option>Diğer</option></select></label>
            <label class="alan"><span>İlçe / Mahalle</span><input type="text" name="konum" maxlength="100"></label>
            <label class="alan"><span>Metrekare</span><input type="number" name="m2" min="0" inputmode="numeric"></label>
            <label class="alan"><span>Oda Sayısı</span><input type="text" name="oda" maxlength="10" placeholder="Örn. 3+1"></label>
            <label class="alan"><span>Beklediğiniz Fiyat (TL)</span><input type="text" name="fiyat" maxlength="30" inputmode="numeric"></label>
            <label class="alan tam"><span>Eklemek istedikleriniz</span><textarea name="not" maxlength="1500" style="min-height:80px"></textarea></label>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
            <button type="submit" class="btn btn-siyah">Değerleme İste</button>
            <button type="button" class="btn btn-wp gizli" data-wp-form="mulk-form">WhatsApp ile Gönder</button>
          </div>
          <div class="sonuc" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </section>
</main>

<footer id="site-alt"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=4"></script>
<script src="js/common.js?v=4"></script>
<script src="js/hesap.js?v=4"></script>
<script src="js/iletisim.js?v=4"></script>
</body>
</html>
